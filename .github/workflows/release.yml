name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Verify build
        run: |
          ls -la .build/release/
          .build/release/swift-ocr --version

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## swift-ocr ${{ steps.version.outputs.VERSION }}

            ### Installation

            **Using Mint:**
            ```bash
            mint install kibotu/swift-ocr@${{ steps.version.outputs.VERSION }}
            ```

            **Manual build:**
            ```bash
            git clone https://github.com/kibotu/swift-ocr.git
            cd swift-ocr
            git checkout ${{ steps.version.outputs.VERSION }}
            swift build -c release
            ```

            **Download binary:**
            Download `swift-ocr` below, make it executable and move it on your PATH:
            ```bash
            chmod +x swift-ocr
            sudo mv swift-ocr /usr/local/bin/
            ```

            ### Changes
            See commit history for details.
          files: |
            .build/release/swift-ocr
          draft: false
          prerelease: false
