name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Vision text recognition hangs indefinitely on hosted macos-26-arm64 runners —
      # neither VNRecognizeTextRequest nor RecognizeDocumentsRequest returns (verified
      # 2026-08-23: zero test completions in 2.5 min; all pass in <1s on real hardware,
      # where the same suites gate every commit). Covered by local dev machines;
      # revisit when the runner image changes.
      - name: Test
        run: swift test --skip 'OcrOptionTests|RecognizerForwardingTests|ConvertTests|DocumentsRecognizerTests|PdfToPdfTests'

      - name: Release build
        run: swift build -c release

      - name: CLI smoke test
        run: |
          .build/release/swift-ocr --help
          .build/release/swift-ocr --version
