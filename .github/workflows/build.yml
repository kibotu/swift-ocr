name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release

      - name: CLI smoke test
        run: |
          .build/release/swift-ocr --help
          .build/release/swift-ocr --version
