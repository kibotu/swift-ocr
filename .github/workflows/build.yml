name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Split so a hang on CI names the culprit group instead of sitting silent.
      - name: Test (no Vision)
        run: swift test --skip 'OcrOptionTests|RecognizerForwardingTests|ConvertTests|DocumentsRecognizerTests|PdfToPdfTests'

      - name: Test (Vision)
        timeout-minutes: 8
        env:
          # Unbuffered stdout — otherwise a killed run takes its log with it.
          NSUnbufferedIO: YES
        run: swift test --filter 'OcrOptionTests|RecognizerForwardingTests|ConvertTests|DocumentsRecognizerTests|PdfToPdfTests'

      - name: Release build
        run: swift build -c release

      - name: CLI smoke test
        run: |
          .build/release/swift-ocr --help
          .build/release/swift-ocr --version
